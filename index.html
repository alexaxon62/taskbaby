<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>taskbaby</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;0,700;1,300&family=Boldonse&family=Syne:wght@400;700;800&display=swap');

:root {
  --bg: #0f0f11;
  --surface: #17171b;
  --surface2: #1e1e24;
  --surface3: #232329;
  --border: #2a2a34;
  --border2: #383848;
  --accent: #ffffff;
  --accent-glow: rgba(255,255,255,0.08);
  --text: #ffffff;
  --text-muted: #ffffff;
  --text-mid: #ffffff;
  --done-text: #44445a;
  --red: #ff4d6d;
  --red-dim: rgba(255,77,109,0.12);
  --link: #ffffff;
  --link-dim: rgba(255,255,255,0.15);
  --blue: #1e3eb5;
  --blue-border: #2a52d4;
  --blue-text: #9ab8ff;
  --green: #0a6335;
  --green-border: #0f8a47;
  --green-text: #5ecf94;
  --node-w: 220px;
  --conn-w: 44px;
  --gap-y: 12px;
  --r: 6px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #5a5a5a;
  color: var(--text);
  font-family: 'Rubik', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: auto;
}

#header {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 10px 20px;
  border-bottom: 1px solid #333;
  background: #5a5a5a;
  flex-shrink: 0;
  z-index: 210;
  position: sticky;
  top: 0;
  gap: 12px;
}

#header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

#header-stats {
  font-size: 0.7rem;
  color: rgba(255,255,255,0.45);
  font-style: italic;
  white-space: nowrap;
  letter-spacing: 0.01em;
  text-align: center;
}
#header-stats .stat-done { color: var(--green-text); font-style: normal; font-weight: 700; }
#header-stats .stat-left { color: rgba(255,255,255,0.7); font-style: normal; font-weight: 700; }
#header-stats .stat-overdue { color: #ff8fa3; font-style: normal; font-weight: 700; }
#header-stats .stat-starred { color: #ffc83c; font-style: normal; font-weight: 700; text-shadow: 0 0 8px rgba(255, 185, 30, 0.5); }

#logo {
  font-family: 'Boldonse', sans-serif;
  font-weight: 400;
  font-size: 1.15rem;
  color: #ffffff;
  letter-spacing: -0.01em;
  user-select: none;
}

/* search */
#search-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
#search-toggle {
  background: none; border: none;
  color: rgba(255,255,255,0.4);
  font-size: 0.82rem;
  cursor: pointer;
  padding: 3px 5px;
  border-radius: 4px;
  transition: color 0.15s;
  line-height: 1;
}
#search-toggle:hover { color: #fff; }
#search-toggle.active { color: #fff; }

#search-box {
  width: 0;
  overflow: hidden;
  background: rgba(0,0,0,0.25);
  border: 1px solid transparent;
  border-radius: 4px;
  color: #fff;
  font-family: 'Rubik', sans-serif;
  font-size: 0.72rem;
  padding: 0;
  outline: none;
  transition: width 0.2s, padding 0.2s, border-color 0.2s;
}
#search-box.open {
  width: 160px;
  padding: 4px 8px;
  border-color: rgba(255,255,255,0.15);
}
#search-box::placeholder { color: rgba(255,255,255,0.25); }
#search-box:focus { border-color: rgba(255,255,255,0.3); }

/* search results dropdown */
#search-results {
  display: none;
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--r);
  z-index: 400;
  min-width: 280px;
  max-width: 360px;
  max-height: 340px;
  overflow-y: auto;
  box-shadow: 0 6px 24px rgba(0,0,0,0.5);
  font-size: 0.73rem;
}
#search-results.show { display: block; }

.search-result {
  padding: 9px 13px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background 0.12s;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.search-result:last-child { border-bottom: none; }
.search-result:hover { background: var(--surface2); }

.sr-title {
  color: var(--text);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sr-title mark {
  background: rgba(255,255,255,0.2);
  color: #fff;
  border-radius: 2px;
  padding: 0 1px;
}
.sr-meta {
  color: var(--text-muted);
  font-size: 0.64rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sr-note {
  color: rgba(255,255,255,0.35);
  font-size: 0.64rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-style: italic;
}
.sr-note mark {
  background: rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.6);
  border-radius: 2px;
  padding: 0 1px;
  font-style: normal;
}
.search-empty {
  padding: 16px 13px;
  color: var(--text-muted);
  font-style: italic;
  font-size: 0.72rem;
}

#header-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: flex-end;
  position: relative;
}

.export-wrap { position: relative; }
.export-menu {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--r);
  overflow: hidden;
  z-index: 300;
  min-width: 140px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.export-menu.open { display: block; }
.export-menu button {
  display: block;
  width: 100%;
  background: none;
  border: none;
  color: var(--text);
  font-family: 'Rubik', sans-serif;
  font-size: 0.72rem;
  padding: 9px 14px;
  text-align: left;
  cursor: pointer;
  transition: background 0.12s;
  letter-spacing: 0.02em;
}
.export-menu button:hover { background: var(--surface2); }

.hbtn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-mid);
  padding: 5px 12px;
  font-family: 'Rubik', sans-serif;
  font-size: 0.72rem;
  cursor: pointer;
  border-radius: var(--r);
  transition: all 0.15s;
  letter-spacing: 0.03em;
}
.hbtn:hover { border-color: var(--border2); color: var(--text); }
.hbtn.primary { background: #fff; color: #0f0f11; border-color: #fff; font-weight: 700; }
.hbtn.primary:hover { opacity: 0.85; }

#tabs-bar {
  display: flex;
  align-items: stretch;
  padding: 0 20px;
  border-bottom: 1px solid #333;
  background: #5a5a5a;
  scrollbar-width: none;
  min-height: 40px;
  position: sticky;
  top: 49px;
  z-index: 199;
}
#tabs-bar::-webkit-scrollbar { display: none; }

.tab {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 12px;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  font-size: 0.73rem;
  color: var(--text-muted);
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
  flex-shrink: 0;
  user-select: none;
}
.tab:hover { color: var(--text-mid); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.tab-name {
  outline: none;
  background: transparent;
  color: inherit;
  font-family: inherit;
  font-size: inherit;
  cursor: pointer;
  min-width: 20px;
  max-width: 150px;
  border: none;
}
.tab.active .tab-name { cursor: text; }

.tab-close, .tab-move {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.58rem;
  padding: 1px 2px;
  border-radius: 2px;
  line-height: 1;
  opacity: 0;
  transition: opacity 0.15s, color 0.15s;
  font-family: inherit;
}
.tab:hover .tab-close,
.tab:hover .tab-move,
.tab.active .tab-close,
.tab.active .tab-move { opacity: 1; }
.tab-close:hover { color: var(--red); }
.tab-move:hover { color: var(--text); }

#add-tab-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 1.1rem;
  padding: 0 10px;
  align-self: center;
  transition: color 0.15s;
  flex-shrink: 0;
  font-family: inherit;
  line-height: 1;
}
#add-tab-btn:hover { color: var(--accent); }

#canvas-wrap {
  flex: 1;
  overflow: auto;
  padding: 28px 32px 80px;
  position: relative;
  min-height: 0;
}

#canvas {
  display: flex;
  flex-direction: column;
  gap: var(--gap-y);
  min-width: max-content;
  position: relative;
  z-index: 1;
}

.node-block {
  display: flex;
  align-items: flex-start;
}

.node {
  width: var(--node-w);
  background: var(--blue);
  border: 1px solid var(--blue-border);
  border-radius: var(--r);
  flex-shrink: 0;
  transition: border-color 0.15s, background 0.3s;
}
.node:hover { border-color: #2a4fd4; }
.node.done {
  background: var(--green);
  border-color: var(--green-border);
}
.node.done:hover { border-color: #0e8040; }
.node.done .node-title { color: var(--green-text); }

/* progress bar */
.progress-bar-wrap {
  height: 3px;
  background: rgba(0,0,0,0.25);
  border-radius: 0;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: var(--green-text);
  transition: width 0.35s ease;
  border-radius: 0;
}
.node.done .progress-bar-wrap { display: none; }

/* overdue — only applies to incomplete tasks */
.node.overdue:not(.done) {
  background: #5a1020 !important;
  border-color: #8a1830 !important;
}
.node.overdue:not(.done):hover { border-color: #b01f3a !important; }
.node.overdue:not(.done) .node-title { color: #ff8fa3; }

/* due date row */
.due-row {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px 4px;
  border-top: 1px solid rgba(255,255,255,0.06);
  font-size: 0.65rem;
}
.due-label { color: rgba(255,255,255,0.35); }
.due-value {
  color: rgba(255,255,255,0.6);
  cursor: pointer;
  border-bottom: 1px dashed rgba(255,255,255,0.2);
  transition: color 0.15s;
}
.due-value:hover { color: #fff; }
.due-value.overdue { color: #ff8fa3; }
.due-clear {
  background: none; border: none;
  color: rgba(255,255,255,0.2);
  cursor: pointer;
  font-size: 0.6rem;
  padding: 0 2px;
  line-height: 1;
  font-family: inherit;
  transition: color 0.15s;
  margin-left: auto;
}
.due-clear:hover { color: var(--red); }
.add-due-btn {
  background: none; border: none;
  color: rgba(255,255,255,0.2);
  font-size: 0.62rem;
  cursor: pointer;
  font-family: inherit;
  padding: 2px 3px;
  border-radius: 2px;
  transition: color 0.15s;
  line-height: 1;
}
.add-due-btn:hover { color: rgba(255,255,255,0.6); }

/* collapse-done prompt */
.collapse-done-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(6,74,39,0.4);
  border: 1px dashed rgba(76,175,125,0.3);
  border-radius: var(--r);
  color: var(--green-text);
  font-size: 0.67rem;
  font-family: 'Rubik', sans-serif;
  cursor: pointer;
  padding: 5px 10px;
  margin-top: 2px;
  transition: background 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.collapse-done-btn:hover {
  background: rgba(6,74,39,0.7);
  border-color: var(--green-text);
}

/* starred / high-priority node — golden halo */
.node.starred {
  box-shadow:
    0 0 0 1px rgba(255, 200, 60, 0.55),
    0 0 8px 2px rgba(255, 185, 30, 0.35),
    0 0 22px 6px rgba(255, 160, 0, 0.18),
    0 0 48px 14px rgba(255, 130, 0, 0.08);
  border-color: rgba(255, 200, 60, 0.6) !important;
}
.node.starred:not(.done):not(.overdue) {
  background: linear-gradient(160deg, #182c6a 0%, #162A91 100%);
}

/* star button */
.star-btn {
  background: none; border: none;
  color: rgba(255,255,255,0.25);
  font-size: 0.72rem;
  cursor: pointer;
  font-family: inherit;
  padding: 2px 3px;
  border-radius: 2px;
  transition: color 0.15s, text-shadow 0.15s;
  line-height: 1;
}
.star-btn:hover { color: rgba(255, 200, 60, 0.7); }
.star-btn.on {
  color: #ffc83c;
  text-shadow: 0 0 6px rgba(255, 185, 30, 0.8), 0 0 14px rgba(255, 130, 0, 0.5);
}


.node-block.dragging { opacity: 0.35; }
.node-block.drag-over-above { border-top: 2px solid rgba(255,255,255,0.5); }
.node-block.drag-over-below { border-bottom: 2px solid rgba(255,255,255,0.5); }

.drag-handle {
  background: none; border: none;
  color: rgba(255,255,255,0.25);
  cursor: grab;
  font-size: 0.65rem;
  padding: 2px 3px;
  line-height: 1;
  font-family: inherit;
  transition: color 0.15s;
  flex-shrink: 0;
  margin-top: 1px;
  touch-action: none;
}
.drag-handle:hover { color: rgba(255,255,255,0.6); }
.drag-handle:active { cursor: grabbing; }

.node-header {
  display: flex;
  align-items: flex-start;
  padding: 8px 9px;
  gap: 6px;
  background: rgba(0,0,0,0.2);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  border-radius: var(--r) var(--r) 0 0;
  min-height: 36px;
}

.done-btn {
  width: 13px; height: 13px;
  border: 1.5px solid rgba(255,255,255,0.2);
  border-radius: 3px;
  background: none;
  cursor: pointer;
  flex-shrink: 0;
  margin-top: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.done-btn:hover { border-color: rgba(255,255,255,0.5); }
.done-btn.on { background: var(--green-text); border-color: var(--green-text); }
.done-btn.on::after { content: '✓'; font-size: 8px; color: #0f0f11; font-weight: 800; }

.node-title {
  flex: 1;
  font-size: 0.76rem;
  font-weight: 500;
  color: var(--blue-text);
  outline: none;
  border: none;
  background: transparent;
  font-family: inherit;
  resize: none;
  width: 100%;
  line-height: 1.4;
  cursor: text;
  word-break: break-word;
  min-height: 1.1em;
}
.node-title:focus { color: var(--text); }
.node.done .node-title:focus { color: var(--green-text); }

.exp-btn {
  background: none; border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.52rem;
  padding: 2px; flex-shrink: 0;
  margin-top: 2px;
  transition: color 0.15s, transform 0.2s;
  line-height: 1;
}
.exp-btn:hover { color: var(--accent); }
.exp-btn.open { transform: rotate(90deg); }
.exp-btn.empty { opacity: 0.15; pointer-events: none; }

.child-count {
  font-size: 0.6rem;
  color: rgba(255,255,255,0.4);
  background: rgba(0,0,0,0.25);
  border-radius: 8px;
  padding: 1px 5px;
  flex-shrink: 0;
  letter-spacing: 0.02em;
  font-weight: 500;
}

.node-footer {
  display: flex;
  align-items: center;
  padding: 4px 8px;
  gap: 3px;
}

.add-btn {
  background: none; border: none;
  color: rgba(255,255,255,0.6);
  font-size: 0.66rem;
  cursor: pointer;
  font-family: inherit;
  padding: 2px 4px;
  border-radius: 3px;
  transition: color 0.15s, background 0.15s;
}
.add-btn:hover { color: #fff; background: var(--accent-glow); }

.spacer { flex: 1; }

.mv-btn, .del-btn {
  background: none; border: none;
  color: rgba(255,255,255,0.4);
  font-size: 0.62rem;
  cursor: pointer;
  font-family: inherit;
  padding: 2px 3px;
  border-radius: 2px;
  transition: color 0.15s;
  line-height: 1;
}
.mv-btn:hover { color: #fff; }
.del-btn:hover { color: var(--red); }

/* hook / connect button */
.hook-btn {
  background: none; border: none;
  color: rgba(255,255,255,0.4);
  font-size: 0.62rem;
  cursor: pointer;
  font-family: inherit;
  padding: 2px 3px;
  border-radius: 2px;
  transition: color 0.15s;
  line-height: 1;
}
.hook-btn:hover { color: var(--link); }

/* connect mode: source node glows */
body.connect-mode { cursor: crosshair; }
body.connect-mode .node { cursor: pointer; }
.node.connect-source { border-color: var(--link) !important; box-shadow: 0 0 0 2px rgba(255,255,255,0.25); }
.node.connect-target-hover { border-color: var(--link) !important; background: var(--link-dim); }

/* full-canvas SVG overlay for freeform links */
#link-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: visible;
}
#link-overlay.active { pointer-events: all; }

/* drag preview line */
#drag-line {
  stroke: var(--link);
  stroke-width: 1.5;
  stroke-dasharray: 5 4;
  fill: none;
  opacity: 0.7;
}

/* link group — dormant by default, rises on .active */
.link-group {
  transition: opacity 0.2s;
}
.link-group.dormant { opacity: 0.18; }
.link-group.active-link {
  opacity: 1;
}

/* base dashed path */
.link-path {
  stroke: var(--link);
  stroke-width: 1.5;
  stroke-dasharray: 6 4;
  fill: none;
  cursor: pointer;
  pointer-events: stroke;
}

/* glow layer behind the dashed line — only visible when active */
.link-glow {
  stroke: var(--link);
  stroke-width: 6;
  fill: none;
  opacity: 0;
  filter: blur(3px);
  pointer-events: none;
  transition: opacity 0.25s;
}
.link-group.active-link .link-glow {
  opacity: 0.45;
  animation: pulse-glow 1.4s ease-in-out infinite;
}

@keyframes pulse-glow {
  0%, 100% { opacity: 0.25; stroke-width: 5; }
  50%       { opacity: 0.65; stroke-width: 9; }
}

/* dash animation when active */
.link-group.active-link .link-path {
  animation: dash-flow 1s linear infinite;
  stroke-width: 2;
}
@keyframes dash-flow {
  to { stroke-dashoffset: -20; }
}

/* link hit area */
.link-hit {
  stroke: transparent;
  stroke-width: 14;
  fill: none;
  cursor: pointer;
  pointer-events: stroke;
}

/* link label */
.link-label-wrap { pointer-events: all; cursor: pointer; }
.link-label-bg { fill: #1a1a22; }
.link-label-text {
  fill: var(--link);
  font-family: 'Rubik', sans-serif;
  font-size: 10px;
  dominant-baseline: middle;
  text-anchor: middle;
}

/* node highlight when its link is active */
.node.link-highlighted {
  border-color: var(--link) !important;
  box-shadow: 0 0 0 2px rgba(255,255,255,0.3), 0 0 12px rgba(255,255,255,0.15);
}

/* connect mode hint */
#connect-hint {
  display: none;
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface2);
  border: 1px solid var(--link);
  color: var(--link);
  font-size: 0.7rem;
  padding: 6px 16px;
  border-radius: 20px;
  z-index: 300;
  pointer-events: none;
  font-family: 'Rubik', sans-serif;
}
body.connect-mode #connect-hint { display: block; }

.children-outer {
  display: flex;
  align-items: flex-start;
}

.conn-col {
  width: var(--conn-w);
  flex-shrink: 0;
  align-self: stretch;
  position: relative;
}
.conn-col svg {
  position: absolute;
  top: 0; left: 0;
  overflow: visible;
  pointer-events: none;
}

.children-col {
  display: flex;
  flex-direction: column;
  gap: var(--gap-y);
}

/* modal */
#modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  z-index: 500;
  align-items: center;
  justify-content: center;
}
#modal-overlay.show { display: flex; }
#modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 28px 30px;
  max-width: 380px;
  width: 90%;
}
#modal h2 { font-family: 'Boldonse',sans-serif; font-size: 1rem; font-weight: 400; margin-bottom: 8px; }
#modal p { font-size: 0.74rem; color: var(--text-mid); margin-bottom: 22px; line-height: 1.6; }
#modal-btns { display: flex; gap: 10px; justify-content: flex-end; }
.mbtn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text-mid); padding: 7px 16px;
  font-family: 'Rubik', sans-serif; font-size: 0.74rem;
  cursor: pointer; border-radius: var(--r); transition: all 0.15s;
}
.mbtn:hover { border-color: var(--border2); color: var(--text); }
.mbtn.accent { background: var(--green-text); color: #0f0f11; border-color: var(--green-text); font-weight: 700; }
.mbtn.accent:hover { opacity: 0.85; }
.mbtn.danger { background: var(--red-dim); border-color: var(--red); color: var(--red); }
.mbtn.danger:hover { background: var(--red); color: #fff; }

/* notes */
.note-btn {
  background: none; border: none;
  color: rgba(255,255,255,0.4);
  font-size: 0.62rem;
  cursor: pointer;
  font-family: inherit;
  padding: 2px 3px;
  border-radius: 2px;
  transition: color 0.15s;
  line-height: 1;
}
.note-btn:hover { color: #fff; }
.note-btn.has-note { color: rgba(255,255,255,0.75); }

.note-area {
  border-top: 1px solid rgba(255,255,255,0.06);
  padding: 6px 9px 7px;
}
.note-textarea {
  width: 100%;
  background: rgba(0,0,0,0.2);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 4px;
  color: rgba(255,255,255,0.75);
  font-family: 'Rubik', sans-serif;
  font-size: 0.68rem;
  line-height: 1.5;
  padding: 5px 7px;
  resize: none;
  outline: none;
  min-height: 52px;
  max-height: 160px;
  overflow-y: auto;
  transition: border-color 0.15s, color 0.15s;
  box-sizing: border-box;
}
.note-textarea::placeholder { color: rgba(255,255,255,0.2); }
.note-textarea:focus { border-color: rgba(255,255,255,0.2); color: #fff; }

.empty-state {
  padding: 48px 0;
  color: var(--text-muted);
  font-size: 0.78rem;
  font-style: italic;
}
.empty-state span { color: var(--accent); cursor: pointer; font-style: normal; }
.empty-state span:hover { text-decoration: underline; }

#file-input { display: none; }

/* ── CALENDAR PICKER ── */
#cal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 600;
  align-items: center;
  justify-content: center;
}
#cal-overlay.show { display: flex; }

#cal-picker {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 20px;
  width: 280px;
  font-family: 'Rubik', sans-serif;
}

#cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
#cal-header button {
  background: none; border: none;
  color: var(--text-mid); cursor: pointer;
  font-size: 1.1rem; padding: 2px 8px;
  border-radius: 4px; transition: color 0.15s, background 0.15s;
  font-family: inherit;
}
#cal-header button:hover { color: #fff; background: var(--surface2); }
#cal-month-label {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.04em;
}

#cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  margin-bottom: 14px;
}
.cal-dow {
  text-align: center;
  font-size: 0.6rem;
  color: var(--text-muted);
  padding: 3px 0 5px;
  letter-spacing: 0.05em;
}
.cal-day {
  text-align: center;
  font-size: 0.72rem;
  padding: 5px 2px;
  border-radius: 4px;
  cursor: pointer;
  color: var(--text-mid);
  transition: background 0.12s, color 0.12s;
  border: 1px solid transparent;
}
.cal-day:hover { background: var(--surface2); color: #fff; }
.cal-day.today { border-color: rgba(255,255,255,0.2); color: #fff; }
.cal-day.selected { background: var(--blue-border); color: #fff; border-color: var(--blue-border); }
.cal-day.other-month { opacity: 0.25; }
.cal-day.past { opacity: 0.35; }

#cal-time-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 16px;
  padding: 8px 10px;
  background: var(--surface2);
  border-radius: 6px;
  border: 1px solid var(--border);
}
.cal-time-label {
  font-size: 0.68rem;
  color: var(--text-muted);
  margin-right: 4px;
  letter-spacing: 0.04em;
}
#cal-hour, #cal-minute {
  width: 44px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 4px;
  color: var(--text);
  font-family: 'Rubik', sans-serif;
  font-size: 0.8rem;
  padding: 4px 6px;
  text-align: center;
  outline: none;
  transition: border-color 0.15s;
}
#cal-hour:focus, #cal-minute:focus { border-color: var(--blue-border); }
.cal-time-sep { color: var(--text-muted); font-size: 0.9rem; }

#cal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
#cal-clear {
  background: none; border: 1px solid var(--border);
  color: var(--text-muted); padding: 6px 12px;
  font-family: 'Rubik', sans-serif; font-size: 0.72rem;
  cursor: pointer; border-radius: var(--r);
  transition: all 0.15s; margin-right: auto;
}
#cal-clear:hover { border-color: var(--red); color: var(--red); }
#cal-cancel {
  background: none; border: 1px solid var(--border);
  color: var(--text-muted); padding: 6px 12px;
  font-family: 'Rubik', sans-serif; font-size: 0.72rem;
  cursor: pointer; border-radius: var(--r); transition: all 0.15s;
}
#cal-cancel:hover { border-color: var(--border2); color: var(--text); }
#cal-confirm {
  background: var(--blue); border: 1px solid var(--blue-border);
  color: #fff; padding: 6px 14px;
  font-family: 'Rubik', sans-serif; font-size: 0.72rem;
  font-weight: 700; cursor: pointer; border-radius: var(--r);
  transition: opacity 0.15s;
}
#cal-confirm:hover { opacity: 0.85; }

/* ── POMODORO TIMER ── */
#pomo-panel {
  display: none;
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 450;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 12px;
  padding: 0;
  width: 240px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.55);
  font-family: 'Rubik', sans-serif;
  user-select: none;
}
#pomo-panel.show { display: block; }
#pomo-panel.is-dragging {
  opacity: 0.92;
  box-shadow: 0 20px 56px rgba(0,0,0,0.75);
}

#pomo-drag-handle {
  height: 26px;
  cursor: grab;
  border-radius: 12px 12px 0 0;
  background: rgba(255,255,255,0.035);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
#pomo-drag-handle::before {
  content: '';
  display: block;
  width: 30px;
  height: 3px;
  border-radius: 2px;
  background: rgba(255,255,255,0.18);
  transition: background 0.15s;
}
#pomo-drag-handle:hover::before { background: rgba(255,255,255,0.36); }
#pomo-drag-handle:active { cursor: grabbing; }

#pomo-inner {
  padding: 14px 20px 16px;
  position: relative;
}

#pomo-modes {
  display: flex;
  gap: 4px;
  margin-bottom: 14px;
}
.pomo-mode-btn {
  flex: 1;
  background: none;
  border: 1px solid var(--border);
  color: rgba(255,255,255,0.4);
  font-family: 'Rubik', sans-serif;
  font-size: 0.6rem;
  padding: 4px 2px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.pomo-mode-btn:hover { color: rgba(255,255,255,0.75); border-color: var(--border2); }
.pomo-mode-btn.active {
  background: var(--surface2);
  border-color: rgba(255,255,255,0.25);
  color: #fff;
  font-weight: 700;
}

#pomo-display {
  text-align: center;
  margin-bottom: 14px;
}
#pomo-time {
  font-family: 'Boldonse', sans-serif;
  font-size: 2.6rem;
  font-weight: 400;
  letter-spacing: 0.01em;
  color: #fff;
  line-height: 1;
  display: block;
  cursor: pointer;
  transition: color 0.2s;
}
#pomo-time:hover { color: rgba(255,255,255,0.75); }
#pomo-session-label {
  font-size: 0.62rem;
  color: rgba(255,255,255,0.35);
  margin-top: 4px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

#pomo-progress-track {
  height: 2px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 14px;
}
#pomo-progress-fill {
  height: 100%;
  background: rgba(255,255,255,0.5);
  border-radius: 2px;
  transition: width 0.5s linear, background 0.3s;
  width: 100%;
}

#pomo-controls {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-bottom: 14px;
}
#pomo-play-btn {
  flex: 1;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  font-family: 'Rubik', sans-serif;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 7px 12px;
  border-radius: var(--r);
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.04em;
}
#pomo-play-btn:hover { background: rgba(255,255,255,0.18); }
#pomo-play-btn.running { background: var(--red-dim); border-color: rgba(255,77,109,0.4); color: var(--red); }
#pomo-play-btn.running:hover { background: rgba(255,77,109,0.2); }

#pomo-reset-btn {
  background: none;
  border: 1px solid var(--border);
  color: rgba(255,255,255,0.4);
  font-family: 'Rubik', sans-serif;
  font-size: 0.7rem;
  padding: 7px 10px;
  border-radius: var(--r);
  cursor: pointer;
  transition: all 0.15s;
}
#pomo-reset-btn:hover { color: #fff; border-color: var(--border2); }

#pomo-settings {
  border-top: 1px solid var(--border);
  padding-top: 12px;
}
.pomo-setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.pomo-setting-row:last-child { margin-bottom: 0; }
.pomo-setting-label {
  font-size: 0.63rem;
  color: rgba(255,255,255,0.4);
  letter-spacing: 0.03em;
}
.pomo-setting-input {
  width: 48px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: 'Rubik', sans-serif;
  font-size: 0.72rem;
  padding: 3px 6px;
  text-align: center;
  outline: none;
  transition: border-color 0.15s;
}
.pomo-setting-input:focus { border-color: rgba(255,255,255,0.3); }

#pomo-close-btn {
  position: absolute;
  top: 50%;
  right: 8px;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: rgba(255,255,255,0.25);
  font-size: 0.68rem;
  cursor: pointer;
  font-family: inherit;
  padding: 2px 4px;
  border-radius: 3px;
  transition: color 0.15s;
  line-height: 1;
  z-index: 2;
}
#pomo-close-btn:hover { color: var(--red); }

/* pulsing ring when running */
@keyframes pomo-pulse {
  0%, 100% { box-shadow: 0 8px 32px rgba(0,0,0,0.55), 0 0 0 0 rgba(255,255,255,0.0); }
  50% { box-shadow: 0 8px 32px rgba(0,0,0,0.55), 0 0 0 3px rgba(255,255,255,0.06); }
}
#pomo-panel.running { animation: pomo-pulse 2s ease-in-out infinite; }
#pomo-panel.break-running { animation: pomo-pulse 2s ease-in-out infinite; }

/* ---- accounts + friends ---- */
#auth-overlay{position:fixed;inset:0;background:rgba(15,15,17,.96);z-index:900;display:none;align-items:center;justify-content:center;padding:20px}
#auth-overlay.show{display:flex}
.auth-box{background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:24px;max-width:340px;width:100%;display:grid;gap:10px}
.auth-box h2{font-family:'Boldonse',sans-serif;font-weight:400;font-size:1.1rem}
.auth-box input{background:var(--bg);border:1px solid var(--border2);color:#fff;border-radius:var(--r);padding:8px 10px;font-family:inherit;font-size:.8rem}
.auth-box p,.auth-box a{font-size:.7rem;opacity:.7;color:#fff}.auth-box a{cursor:pointer;text-decoration:underline}
#social{position:fixed;top:0;right:0;bottom:0;width:300px;max-width:92vw;background:var(--surface);border-left:1px solid var(--border2);z-index:350;transform:translateX(100%);transition:transform .2s;overflow-y:auto;padding:14px;font-size:.74rem;display:flex;flex-direction:column;gap:14px}
#social.open{transform:none}
#social h3{font-size:.65rem;letter-spacing:.06em;text-transform:lowercase;opacity:.55;margin-bottom:6px}
.fr{display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);color:#fff;border-radius:var(--r);padding:8px 10px;margin-bottom:6px;cursor:pointer;font-family:inherit}
.fr:hover,.fr.sel{border-color:#fff}
.fr .sub{opacity:.55;font-size:.64rem;margin-top:2px}
.fr .bar{height:4px;background:rgba(0,0,0,.4);border-radius:2px;margin-top:5px;overflow:hidden}.fr .bar i{display:block;height:100%;background:var(--green-text)}
.fe{padding:5px 0;border-bottom:1px solid var(--border);font-size:.68rem}.fe b{color:var(--green-text);font-weight:500}.fe span{opacity:.45}
#view-banner{display:none;position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:360;background:#fff;color:#0f0f11;border-radius:20px;padding:6px 14px;font-size:.72rem;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#view-banner button{margin-left:8px;border:none;background:#0f0f11;color:#fff;border-radius:10px;padding:2px 9px;cursor:pointer;font-family:inherit;font-size:.68rem}
body.viewing #view-banner{display:block}
body.viewing .tab-close,body.viewing .tab-move,body.viewing #add-tab-btn,body.viewing #header-actions button[onclick^="addRootNode"],body.viewing #header-actions button[onclick^="triggerImport"]{display:none}
body.viewing .tab-name{pointer-events:none}
</style>

<body>

<div id="header">
  <div id="header-left">
    <div id="logo">taskbaby</div>
    <span style="color:rgba(255,255,255,0.6);font-size:0.7rem;font-style:italic">defeat the babies, mercilessly.</span>
    <div id="search-wrap">
      <button id="search-toggle" title="search tasks">⌕</button>
      <input id="search-box" type="text" placeholder="search titles & notes…" spellcheck="false" autocomplete="off"/>
      <div id="search-results"></div>
    </div>
  </div>
  <div id="header-stats"></div>
  <div id="header-actions">
    <button class="hbtn" onclick="triggerImport()">↑ import</button>
    <div class="export-wrap">
      <button class="hbtn" onclick="toggleExportMenu(event)">↓ export ▾</button>
      <div class="export-menu" id="export-menu">
        <button onclick="exportTab()">↓ export this tab</button>
        <button onclick="exportAll()">↓ export all tabs</button>
      </div>
    </div>
    <button class="hbtn" id="priority-btn" onclick="togglePriorityFilter()" title="show starred tasks and their context">priority</button>
    <button class="hbtn" id="social-btn" onclick="toggleSocial()" style="display:none">friends</button>
    <button class="hbtn" id="pomo-btn" onclick="togglePomoPanel()" title="pomodoro timer">⏱ pomo</button>
    <button class="hbtn" onclick="setAllExpanded(true)" title="expand all tasks">⊞ open all</button>
    <button class="hbtn" onclick="setAllExpanded(false)" title="collapse all tasks">⊟ close all</button>
    <button class="hbtn primary" onclick="addRootNode()">+ new task</button>
  </div>
</div>


<div id="auth-overlay"><div class="auth-box" id="auth-box"></div></div>
<div id="view-banner"><span id="view-banner-text"></span><button onclick="backToMine()">back to mine</button></div>
<div id="social"></div>

<div id="tabs-bar">
  <button id="add-tab-btn" title="new tab" onclick="addTab()">+</button>
</div>

<div id="canvas-wrap">
  <svg id="link-overlay"><path id="drag-line" d="" style="display:none"/></svg>
  <div id="canvas"></div>
</div>
<div id="connect-hint">click another task to link — esc to cancel</div>

<div id="modal-overlay">
  <div id="modal">
    <h2 id="modal-title"></h2>
    <p id="modal-body"></p>
    <div id="modal-btns"></div>
  </div>
</div>

<input type="file" id="file-input" accept=".json" onchange="handleImportFile(event)"/>

<!-- pomodoro panel -->
<div id="pomo-panel" style="position:fixed;">
  <div id="pomo-drag-handle" title="drag to move">
    <button id="pomo-close-btn" onclick="togglePomoPanel()" title="close">✕</button>
  </div>
  <div id="pomo-inner">
  <div id="pomo-modes">
    <button class="pomo-mode-btn active" data-mode="work" onclick="pomoSetMode('work')">work</button>
    <button class="pomo-mode-btn" data-mode="short" onclick="pomoSetMode('short')">short brk</button>
    <button class="pomo-mode-btn" data-mode="long" onclick="pomoSetMode('long')">long brk</button>
  </div>
  <div id="pomo-display">
    <span id="pomo-time" onclick="pomoToggle()" title="click to start/pause">25:00</span>
    <div id="pomo-session-label">work session</div>
  </div>
  <div id="pomo-progress-track"><div id="pomo-progress-fill"></div></div>
  <div id="pomo-controls">
    <button id="pomo-play-btn" onclick="pomoToggle()">▶ start</button>
    <button id="pomo-reset-btn" onclick="pomoReset()" title="reset">↺ reset</button>
  </div>
  <div id="pomo-settings">
    <div class="pomo-setting-row">
      <span class="pomo-setting-label">work (min)</span>
      <input class="pomo-setting-input" id="pomo-work-input" type="number" min="1" max="99" value="25" onchange="pomoUpdateDurations()"/>

      <span class="pomo-setting-label">short break</span>
      <input class="pomo-setting-input" id="pomo-short-input" type="number" min="1" max="99" value="5" onchange="pomoUpdateDurations()"/>
    </div>
    <div class="pomo-setting-row">
      <span class="pomo-setting-label">long break</span>
      <input class="pomo-setting-input" id="pomo-long-input" type="number" min="1" max="99" value="15" onchange="pomoUpdateDurations()"/>
    </div>
  </div>
  </div>
</div>

<!-- calendar picker -->
<div id="cal-overlay">
  <div id="cal-picker">
    <div id="cal-header">
      <button id="cal-prev">‹</button>
      <span id="cal-month-label"></span>
      <button id="cal-next">›</button>
    </div>
    <div id="cal-grid"></div>
    <div id="cal-time-row">
      <span class="cal-time-label">time</span>
      <input id="cal-hour" type="number" min="0" max="23" placeholder="HH"/>

      <input id="cal-minute" type="number" min="0" max="59" placeholder="MM"/>
    </div>
    <div id="cal-actions">
      <button id="cal-clear">clear</button>
      <button id="cal-cancel">cancel</button>
      <button id="cal-confirm">set due</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'taskbaby-v2';
let state = { tabs: [], activeTab: null };
let _uid = Date.now();

function uid() { return 'n' + (_uid++); }
function makeNode(title = 'new task') { return { id: uid(), title, done: false, expanded: true, starred: false, children: [] }; }
function makeTab(name = 'untitled') { return { id: uid(), name, tree: [] }; }
function activeTab() { return state.tabs.find(t => t.id === state.activeTab) || state.tabs[0]; }

// storage (local + supabase)
const SB_URL='https://ltojciroeonpvlxhwcwu.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0b2pjaXJvZW9ucHZseGh3Y3d1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1MzExNzgsImV4cCI6MjExMDEwNzE3OH0.tJ8j37FllNFmxjffr9xCY_m0xqaOphymkfrwya4_19g'; // anon key: public by design, RLS protects the data
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY):null;
let me=null,myName='',group=null,viewingFriend=null,myState=null,friends={},names={},feed=[],saveTimer=null,lastDone=null,syncMsg='';

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function doneMap(st){const m=new Map();function w(ns){ns.forEach(n=>{if(n.done)m.set(n.id,n.title);w(n.children||[])})}(st.tabs||[]).forEach(t=>w(t.tree||[]));return m}
function stripNotes(st){const c=JSON.parse(JSON.stringify(st));function w(ns){ns.forEach(n=>{delete n.note;w(n.children||[])})}(c.tabs||[]).forEach(t=>w(t.tree||[]));return c}

async function persist() {
  if (viewingFriend) return; // never save while looking at someone else's board
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  if (!me || !group) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushState, 700);
}

async function pushState() {
  const mine = JSON.parse(JSON.stringify(viewingFriend ? myState : state));
  const done = doneMap(mine), fresh = [];
  if (lastDone) done.forEach((t,id)=>{ if(!lastDone.has(id)) fresh.push(t); });
  lastDone = done;
  const now = new Date().toISOString();
  const r1 = await sb.from('private_boards').upsert({ user_id: me.id, state: mine, updated_at: now });

function fixUids() {
  function walk(nodes) {
    nodes.forEach(n => {
      const num = parseInt(n.id.replace('n',''));
      if (!isNaN(num) && num >= _uid) _uid = num + 1;
      walk(n.children);
    });
  }
  state.tabs.forEach(t => {
    const num = parseInt(t.id.replace('n',''));
    if (!isNaN(num) && num >= _uid) _uid = num + 1;
    walk(t.tree);
  });
}

// tree utils
function findNode(nodes, id) {
  for (const n of nodes) {
    if (n.id === id) return n;
    const f = findNode(n.children, id);
    if (f) return f;
  }
  return null;
}

function findContext(nodes, id) {
  for (let i = 0; i < nodes.length; i++) {
    if (nodes[i].id === id) return { list: nodes, index: i };
    const f = findContext(nodes[i].children, id);
    if (f) return f;
  }
  return null;
}

function countDesc(node) {
  let c = 0;
  (function w(n) { c += n.children.length; n.children.forEach(w); })(node);
  return c;
}

// node actions
function addRootNode() {
  const tab = activeTab();
  if (!tab) return;
  const n = makeNode();
  tab.tree.push(n);
  persist(); renderCanvas();
  setTimeout(() => focusNode(n.id), 40);
}

function addChild(parentId) {
  const tab = activeTab();
  const parent = findNode(tab.tree, parentId);
  if (!parent) return;
  parent.expanded = true;
  const n = makeNode();
  parent.children.push(n);
  // new baby means parent can't be considered done anymore
  if (parent.done) {
    parent.done = false;
    uncheckAncestors(parentId);
  }
  persist(); renderCanvas();
  setTimeout(() => focusNode(n.id), 40);
}

function deleteNode(id) {
  const tab = activeTab();
  const node = findNode(tab.tree, id);
  const dc = countDesc(node);
  const doDelete = () => {
    const ctx = findContext(tab.tree, id);
    if (ctx) ctx.list.splice(ctx.index, 1);
    persist(); renderCanvas(); closeModal();
  };
  if (dc > 0) {
    showModal(`woah there, genghis khan. delete "${node.title}"?`, `this will also nuke ${dc} nested task(s). no undo.`, [
      { label: 'cancel', cls: 'mbtn', action: closeModal },
      { label: 'delete all', cls: 'mbtn danger', action: doDelete }
    ]);
  } else { doDelete(); }
}

function allChildrenDone(node) {
  if (!node.children.length) return true;
  return node.children.every(c => c.done && allChildrenDone(c));
}

function findParentOf(nodes, id, parent) {
  for (const n of nodes) {
    if (n.id === id) return parent || null;
    const found = findParentOf(n.children, id, n);
    if (found !== undefined) return found;
  }
  return undefined;
}

function checkAndAutoCompleteAncestors(nodeId) {
  const tree = activeTab().tree;
  let parent = findParentOf(tree, nodeId, null);
  while (parent) {
    if (!parent.done && allChildrenDone(parent)) {
      parent.done = true;
      parent = findParentOf(tree, parent.id, null);
    } else break;
  }
}

function uncheckAncestors(nodeId) {
  const tree = activeTab().tree;
  let parent = findParentOf(tree, nodeId, null);
  while (parent) {
    if (parent.done) {
      parent.done = false;
      parent = findParentOf(tree, parent.id, null);
    } else break;
  }
}

function toggleDone(id) {
  const n = findNode(activeTab().tree, id);
  if (!n) return;
  if (n.done) {
    n.done = false;
    uncheckAncestors(id);
    persist(); renderCanvas(); drawLinks();
    return;

    showModal(

        { label: 'cancel', cls: 'mbtn', action: closeModal },

          n.done = true;

        }}
      ]
    );
  } else {
    n.done = true;
    checkAndAutoCompleteAncestors(id);
    persist(); renderCanvas(); drawLinks();
  }
}

let priorityFilterActive = false;

// returns set of node ids visible in priority mode: starred + ancestors + descendants
function getPriorityVisibleIds(tree) {
  const visible = new Set();
  const starredIds = new Set();
  function findStarred(nodes) {
    nodes.forEach(n => {
      if (n.starred && !n.done) starredIds.add(n.id);
      findStarred(n.children);
    });
  }
  findStarred(tree);
  if (starredIds.size === 0) return visible;

  function markDescendants(node) {
    visible.add(node.id);
    node.children.forEach(markDescendants);
  }
  function walkAndMark(nodes, targetIds, chain) {
    for (const n of nodes) {
      const newChain = [...chain, n.id];
      if (targetIds.has(n.id)) {
        newChain.forEach(id => visible.add(id));
        markDescendants(n);
      }
      walkAndMark(n.children, targetIds, newChain);
    }
  }
  walkAndMark(tree, starredIds, []);
  return visible;
}

function togglePriorityFilter() {
  priorityFilterActive = !priorityFilterActive;
  const btn = document.getElementById('priority-btn');
  if (btn) {
    btn.style.color = priorityFilterActive ? '#ffc83c' : '';
    btn.style.borderColor = priorityFilterActive ? 'rgba(255,200,60,0.5)' : '';
    btn.style.textShadow = priorityFilterActive ? '0 0 8px rgba(255,185,30,0.5)' : '';

}

function moveNode(id, dir) {

  if (!ctx) return;
  const { list, index } = ctx;
  if (dir === 'up' && index > 0) [list[index-1], list[index]] = [list[index], list[index-1]];
  if (dir === 'down' && index < list.length-1) [list[index], list[index+1]] = [list[index+1], list[index]];
  persist(); renderCanvas();
}

// ── CALENDAR PICKER ──────────────────────────────────────────────────────────
let calState = { nodeId: null, year: 0, month: 0, selectedDate: null };

function openCalendar(nodeId) {
  const n = findNode(activeTab().tree, id = nodeId);
  if (!n) return;
  const now = new Date();
  calState.nodeId = nodeId;

  if (n.due) {
    const d = new Date(n.due);
    calState.year = d.getFullYear();
    calState.month = d.getMonth();
    calState.selectedDate = n.due.slice(0, 10);
    const parts = n.due.split('T');
    if (parts[1]) {
      const [h, m] = parts[1].split(':');
      document.getElementById('cal-hour').value = h || '';
      document.getElementById('cal-minute').value = m || '';
    } else {
      document.getElementById('cal-hour').value = '';
      document.getElementById('cal-minute').value = '';
    }
  } else {
    calState.year = now.getFullYear();
    calState.month = now.getMonth();
    calState.selectedDate = null;
    document.getElementById('cal-hour').value = '';
    document.getElementById('cal-minute').value = '';
  }

  renderCalendar();
  document.getElementById('cal-overlay').classList.add('show');
}

function renderCalendar() {
  const { year, month, selectedDate } = calState;
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cal-month-label').textContent = `${months[month]} ${year}`;

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  const days = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  days.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow'; el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrev = new Date(year, month, 0).getDate();
  const today = new Date().toISOString().slice(0, 10);

  // prev month padding
  for (let i = firstDay - 1; i >= 0; i--) {
    const el = document.createElement('div');
    el.className = 'cal-day other-month';
    el.textContent = daysInPrev - i;
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const pad = n => String(n).padStart(2, '0');
    const dateStr = `${year}-${pad(month + 1)}-${pad(d)}`;
    const el = document.createElement('div');
    let cls = 'cal-day';
    if (dateStr === today) cls += ' today';
    if (dateStr === selectedDate) cls += ' selected';
    if (dateStr < today) cls += ' past';
    el.className = cls;
    el.textContent = d;
    el.addEventListener('click', () => {
      calState.selectedDate = dateStr;
      renderCalendar();
    });
    grid.appendChild(el);
  }

  // next month padding
  const total = firstDay + daysInMonth;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let d = 1; d <= remaining; d++) {
    const el = document.createElement('div');
    el.className = 'cal-day other-month'; el.textContent = d;
    grid.appendChild(el);
  }
}

document.getElementById('cal-prev').onclick = () => {
  calState.month--;
  if (calState.month < 0) { calState.month = 11; calState.year--; }
  renderCalendar();
};
document.getElementById('cal-next').onclick = () => {
  calState.month++;
  if (calState.month > 11) { calState.month = 0; calState.year++; }
  renderCalendar();
};
document.getElementById('cal-cancel').onclick = () => {

function isOverdue(node) {
  if (!node.due || node.done) return false;
  const now = new Date();
  let due;
  if (node.due.includes('T')) {
    due = new Date(node.due);
  } else {
    const [y, m, d] = node.due.split('-').map(Number);
    due = new Date(y, m - 1, d, 23, 59, 59);
  }
  return due < now;
}

function formatDue(dueStr) {
  if (!dueStr) return '';
  const hasTime = dueStr.includes('T');
  const date = new Date(dueStr);
  const pad = n => String(n).padStart(2, '0');
  const datepart = `${pad(date.getMonth()+1)}/${pad(date.getDate())}/${date.getFullYear()}`;
  if (!hasTime) return datepart;
  return `${datepart} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

function allChildrenAllDone(node) {
  return node.children.length > 0 && node.children.every(c => c.done);
}

function focusNode(id) {
  const el = document.querySelector(`.node-block[data-id="${id}"] .node-title`);
  if (el) { el.focus(); selectAllEl(el); }
}

function selectAllEl(el) {
  try {
    const r = document.createRange();
    r.selectNodeContents(el);
    const s = window.getSelection();
    s.removeAllRanges(); s.addRange(r);
  } catch(e) {}
}

function downloadJSON(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function makeFilename(name) {
  const slug = (name || 'taskbaby').replace(/[^a-z0-9_\-]/gi, '_');
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const dt = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}`;
  return `${slug}_${dt}.json`;
}

  // export as a valid taskbaby file containing just this tab
  downloadJSON({ tabs: [tab], activeTab: tab.id }, makeFilename(tab.name));
}

function exportAll() {
  document.getElementById('export-menu').classList.remove('open');
  const tab = activeTab();
  downloadJSON(state, makeFilename(tab?.name + '_all'));
}

function triggerImport() {
  document.getElementById('file-input').value = '';

// deep-clone a tab and assign brand new IDs to everything in it
function reIDTab(tab) {
  const idMap = {};
  function newId(oldId) {
    if (!idMap[oldId]) idMap[oldId] = uid();
    return idMap[oldId];
  }
  function reIDNode(n) {
    return {
      ...n,
      id: newId(n.id),
      children: n.children.map(reIDNode)
    };
  }
  const newTab = {
    ...tab,
    id: uid(),
    tree: tab.tree.map(reIDNode)
  };
  // remap any links using the id map
  if (tab.links) {
    newTab.links = tab.links
      .filter(l => idMap[l.from] && idMap[l.to])
      .map(l => ({ ...l, id: uid(), from: idMap[l.from], to: idMap[l.to] }));
  }
  return newTab;
}

function handleImportFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    let imported;
    try { imported = JSON.parse(ev.target.result); } catch(err) {
      showModal('that makes no sense.', "couldn't parse that JSON.", [{ label: 'ok', cls: 'mbtn', action: closeModal }]);
      return;
    }
    if (!imported.tabs || !Array.isArray(imported.tabs)) {
      showModal('gross file', "doesn't look like a taskbaby export. what did you upload?", [{ label: 'ok', cls: 'mbtn', action: closeModal }]);
      return;
    }
    showModal(
      'import',
      `found ${imported.tabs.length} tab(s) in this file.`,
      [
        { label: 'cancel', cls: 'mbtn', action: closeModal },
        { label: 'merge', cls: 'mbtn accent', action: () => {
          imported.tabs.forEach(t => state.tabs.push(reIDTab(t)));
          if (!state.activeTab) state.activeTab = state.tabs[0]?.id;
          persist(); renderAll(); closeModal();
        }},
        { label: 'replace all', cls: 'mbtn danger', action: () => {
          state = imported;
          fixUids(); persist(); renderAll(); closeModal();
        }}
      ]
    );
  };
  reader.readAsText(file);
}

// modal
function showModal(title, body, buttons) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').textContent = body;
  const btns = document.getElementById('modal-btns');
  btns.innerHTML = '';

}
function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); }
document.getElementById('modal-overlay').addEventListener('click', e => {

});

// render tabs
function renderTabs() {
  const bar = document.getElementById('tabs-bar');
  const addBtn = document.getElementById('add-tab-btn');
  bar.querySelectorAll('.tab').forEach(el => el.remove());

  state.tabs.forEach(tab => {
    const el = document.createElement('div');
    el.className = 'tab' + (tab.id === state.activeTab ? ' active' : '');
    el.dataset.tab = tab.id;
    el.onclick = e => {
      if (e.target.classList.contains('tab-close') || e.target.classList.contains('tab-move')) return;
      if (e.target.classList.contains('tab-name') && tab.id === state.activeTab) return;
      switchTab(tab.id);
    };

    const ml = document.createElement('button');
    ml.className = 'tab-move'; ml.textContent = '◂'; ml.title = 'move left';
    ml.onclick = e => { e.stopPropagation(); moveTab(tab.id, 'left'); };

    const name = document.createElement('span');
    name.className = 'tab-name';
    name.contentEditable = tab.id === state.activeTab ? 'true' : 'false';
    name.textContent = tab.name;
    name.spellcheck = false;
    name.addEventListener('input', () => renameTab(tab.id, name.textContent.trim()));
    name.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); name.blur(); } });
    name.addEventListener('click', e => { if (tab.id === state.activeTab) { e.stopPropagation(); } });

    const mr = document.createElement('button');
    mr.className = 'tab-move'; mr.textContent = '▸'; mr.title = 'move right';
    mr.onclick = e => { e.stopPropagation(); moveTab(tab.id, 'right'); };

    const close = document.createElement('button');
    close.className = 'tab-close'; close.textContent = '✕'; close.title = 'delete tab';
    close.onclick = e => { e.stopPropagation(); deleteTab(tab.id); };

    el.appendChild(ml); el.appendChild(name); el.appendChild(mr); el.appendChild(close);
    bar.insertBefore(el, addBtn);
  });
}

// render canvas
function renderCanvas() {
  const canvas = document.getElementById('canvas');
  canvas.innerHTML = '';
  document.getElementById('link-overlay').querySelectorAll('.link-group').forEach(el => el.remove());
  const tab = activeTab();
  renderStats();
  if (!tab || tab.tree.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = 'no tasks here. <span onclick="addRootNode()">add one.</span>';
    canvas.appendChild(empty);
    return;
  }
  tab.tree.forEach(node => {
    const el = buildNodeEl(node, priorityFilterActive ? getPriorityVisibleIds(tab.tree) : null);
    if (el) canvas.appendChild(el);
  });
  setTimeout(() => { redrawAllConnectors(); drawLinks(); }, 60);
}

function buildNodeEl(node, visibleIds = null) {
  // in priority filter mode, skip nodes not in the visible set
  if (visibleIds && !visibleIds.has(node.id)) return null;
  const wrap = document.createElement('div');
  wrap.className = 'node-block';
  wrap.dataset.id = node.id;
  wrap.draggable = false;

  const card = document.createElement('div');
  const overdueNode = isOverdue(node);
  card.className = 'node' + (node.done ? ' done' : '') + (overdueNode ? ' overdue' : '') + (node.starred ? ' starred' : '');

  const hdr = document.createElement('div');
  hdr.className = 'node-header';

  const doneBtn = document.createElement('button');
  doneBtn.className = 'done-btn' + (node.done ? ' on' : '');
  doneBtn.onclick = () => toggleDone(node.id);

  const titleEl = document.createElement('div');
  titleEl.className = 'node-title';
  titleEl.contentEditable = 'true';
  titleEl.spellcheck = false;
  titleEl.textContent = node.title;
  titleEl.addEventListener('input', () => updateTitle(node.id, titleEl.textContent.trim()));
  titleEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); } });

  const expBtn = document.createElement('button');
  expBtn.className = 'exp-btn' + (node.expanded ? ' open' : '') + (node.children.length === 0 ? ' empty' : '');
  expBtn.textContent = '▶';
  expBtn.onclick = () => toggleExpand(node.id);

  const dragHandle = document.createElement('button');
  dragHandle.className = 'drag-handle';
  dragHandle.textContent = '⠿';
  dragHandle.title = 'drag to reorder';
  dragHandle.addEventListener('mousedown', () => { wrap.draggable = true; });
  dragHandle.addEventListener('mouseup', () => { wrap.draggable = false; });

  hdr.appendChild(dragHandle);
  hdr.appendChild(doneBtn);
  hdr.appendChild(titleEl);
  if (!node.expanded && node.children.length > 0) {
    const total = countDesc(node);
    const badge = document.createElement('span');
    badge.className = 'child-count';
    badge.textContent = total;
    badge.title = `${total} nested task${total === 1 ? '' : 's'}`;
    hdr.appendChild(badge);
  }
  hdr.appendChild(expBtn);

  // progress bar (only for nodes with children)
  if (node.children.length > 0 && !node.done) {
    const pct = Math.round(weightedProgress(node) * 100);
    const pbWrap = document.createElement('div');
    pbWrap.className = 'progress-bar-wrap';
    const pbFill = document.createElement('div');
    pbFill.className = 'progress-bar-fill';
    pbFill.style.width = pct + '%';
    pbWrap.appendChild(pbFill);
    card.appendChild(hdr);
    card.appendChild(pbWrap);
  } else {
    card.appendChild(hdr);
  }

  const ftr = document.createElement('div');
  ftr.className = 'node-footer';

  const addBtn = document.createElement('button');
  addBtn.className = 'add-btn'; addBtn.textContent = '+ add baby';
  addBtn.onclick = () => addChild(node.id);

  const spacer = document.createElement('div'); spacer.className = 'spacer';

  const upBtn = document.createElement('button');
  upBtn.className = 'mv-btn'; upBtn.textContent = '↑'; upBtn.title = 'move up';
  upBtn.onclick = () => moveNode(node.id, 'up');

  const downBtn = document.createElement('button');
  downBtn.className = 'mv-btn'; downBtn.textContent = '↓'; downBtn.title = 'move down';
  downBtn.onclick = () => moveNode(node.id, 'down');

  const delBtn = document.createElement('button');
  delBtn.className = 'del-btn'; delBtn.textContent = '✕';
  delBtn.onclick = () => deleteNode(node.id);

  const hookBtn = document.createElement('button');
  hookBtn.className = 'hook-btn'; hookBtn.textContent = '⌁'; hookBtn.title = 'link to another task';
  hookBtn.onclick = () => startConnect(node.id);

  const dueBtn = document.createElement('button');
  dueBtn.className = 'add-due-btn'; dueBtn.textContent = '⏱'; dueBtn.title = 'set due date';
  dueBtn.onclick = () => setDueDate(node.id);

  const noteBtn = document.createElement('button');
  noteBtn.className = 'note-btn' + (node.note ? ' has-note' : '');
  noteBtn.textContent = '✎';
  noteBtn.title = node.note ? 'edit note' : 'add note';

  const starBtn = document.createElement('button');
  starBtn.className = 'star-btn' + (node.starred ? ' on' : '');
  starBtn.textContent = '★';
  starBtn.title = node.starred ? 'unstar task' : 'star as high priority';
  starBtn.onclick = () => toggleStar(node.id);

  ftr.appendChild(addBtn); ftr.appendChild(spacer);
  ftr.appendChild(starBtn);
  ftr.appendChild(upBtn); ftr.appendChild(downBtn);
  ftr.appendChild(dueBtn); ftr.appendChild(noteBtn);
  ftr.appendChild(hookBtn); ftr.appendChild(delBtn);

  card.appendChild(ftr);

  // note area — shown if node has a note or noteOpen flag
  const noteArea = document.createElement('div');
  noteArea.className = 'note-area';
  noteArea.style.display = (node.note || node.noteOpen) ? 'block' : 'none';

  const noteTA = document.createElement('textarea');
  noteTA.className = 'note-textarea';
  noteTA.placeholder = 'notes...';
  noteTA.value = node.note || '';
  noteTA.addEventListener('input', () => {
    node.note = noteTA.value;
    noteBtn.className = 'note-btn' + (node.note ? ' has-note' : '');
    noteBtn.title = node.note ? 'edit note' : 'add note';
    persist();

  noteTA.addEventListener('input', () => {
    noteTA.style.height = 'auto';
    noteTA.style.height = Math.min(noteTA.scrollHeight, 160) + 'px';
  });

  noteArea.appendChild(noteTA);
  card.appendChild(noteArea);

  noteBtn.onclick = () => {
    const open = noteArea.style.display === 'none';
    noteArea.style.display = open ? 'block' : 'none';
