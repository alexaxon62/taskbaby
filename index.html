      noteTA.focus();
      noteTA.style.height = 'auto';
      noteTA.style.height = Math.min(noteTA.scrollHeight, 160) + 'px';
      setTimeout(() => { redrawAllConnectors(); drawLinks(); }, 60);
    } else {
      setTimeout(() => { redrawAllConnectors(); drawLinks(); }, 60);
    }
  };

  // due date row
  if (node.due) {
    const dueRow = document.createElement('div');
    dueRow.className = 'due-row';
    const lbl = document.createElement('span');
    lbl.className = 'due-label'; lbl.textContent = 'due:';
    const val = document.createElement('span');
    val.className = 'due-value' + (overdueNode ? ' overdue' : '');
    val.textContent = formatDue(node.due);
    val.title = 'click to change';
    val.onclick = () => setDueDate(node.id);
    const clr = document.createElement('button');
    clr.className = 'due-clear'; clr.textContent = '✕'; clr.title = 'clear due date';
    clr.onclick = () => clearDueDate(node.id);
    dueRow.appendChild(lbl); dueRow.appendChild(val); dueRow.appendChild(clr);
    card.appendChild(dueRow);
  }

  wrap.appendChild(card);

  if ((node.expanded || visibleIds) && node.children.length > 0) {
    const outer = document.createElement('div');
    outer.className = 'children-outer';

    const connCol = document.createElement('div');
    connCol.className = 'conn-col';

    const childrenCol = document.createElement('div');
    childrenCol.className = 'children-col';

    node.children.forEach(child => {
      const el = buildNodeEl(child, visibleIds);
      if (el) childrenCol.appendChild(el);
    });

    outer.appendChild(connCol);
    outer.appendChild(childrenCol);
    wrap.appendChild(outer);

    requestAnimationFrame(() => drawConnectors(card, connCol, childrenCol));

    // collapse-done prompt: show when all direct children are done
    if (allChildrenAllDone(node)) {
      const colBtn = document.createElement('button');
      colBtn.className = 'collapse-done-btn';
      colBtn.innerHTML = '↙ all done — collapse?';
      colBtn.title = 'collapse this completed branch';
      colBtn.onclick = () => toggleExpand(node.id);
      // sits below the children-outer, indented to align
      const colWrap = document.createElement('div');
      colWrap.style.cssText = 'display:flex;margin-left:8px;margin-top:4px;';
      colWrap.appendChild(colBtn);
      wrap.appendChild(colWrap);
    }
  }

  makeDraggable(wrap, node);
  return wrap;
}

// connectors
const CW = 44, CR = 9;

function drawConnectors(parentCard, connCol, childrenCol) {
  connCol.innerHTML = '';
  const pr = parentCard.getBoundingClientRect();
  const cr = connCol.getBoundingClientRect();
  if (!cr.height) return;

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.style.cssText = `position:absolute;top:0;left:0;width:${CW}px;height:${cr.height}px;overflow:visible;pointer-events:none`;

  const pMidY = pr.top + pr.height / 2;

  for (const childWrap of childrenCol.children) {
    const cc = childWrap.querySelector(':scope > .node');
    if (!cc) continue;
    const ccr = cc.getBoundingClientRect();
    const cMidY = ccr.top + ccr.height / 2 - cr.top;
    const pRelY = pMidY - cr.top;
    const mx = CW / 2;
    const dy = cMidY - pRelY;
    const r = Math.min(CR, Math.abs(dy) / 2, mx / 2);

    let d;
    if (Math.abs(dy) < 1) {
      d = `M 0 ${pRelY} H ${CW}`;
    } else if (dy > 0) {
      d = `M 0 ${pRelY} H ${mx-r} Q ${mx} ${pRelY} ${mx} ${pRelY+r} V ${cMidY-r} Q ${mx} ${cMidY} ${mx+r} ${cMidY} H ${CW}`;
    } else {
      d = `M 0 ${pRelY} H ${mx-r} Q ${mx} ${pRelY} ${mx} ${pRelY-r} V ${cMidY+r} Q ${mx} ${cMidY} ${mx+r} ${cMidY} H ${CW}`;
    }

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('stroke', '#28283a');
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-linecap', 'round');
    svg.appendChild(path);
  }
  connCol.appendChild(svg);
}

function redrawAllConnectors() {
  document.querySelectorAll('.node-block[data-id]').forEach(wrap => {
    const node = findNode(activeTab()?.tree || [], wrap.dataset.id);
    if (!node?.expanded || !node.children.length) return;
    const card = wrap.querySelector(':scope > .node');
    const outer = wrap.querySelector(':scope > .children-outer');
    if (!card || !outer) return;
    drawConnectors(card, outer.children[0], outer.children[1]);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// FREEFORM LINK SYSTEM
// ─────────────────────────────────────────────────────────────────────────────
let connectSource = null; // node id being linked from

function getTabLinks() {
  const tab = activeTab();
  if (!tab.links) tab.links = [];
  return tab.links;
}

function startConnect(fromId) {
  connectSource = fromId;
  document.body.classList.add('connect-mode');
  // highlight source node
  document.querySelectorAll('.node').forEach(n => n.classList.remove('connect-source'));
  const srcWrap = document.querySelector(`.node-block[data-id="${fromId}"]`);
  if (srcWrap) srcWrap.querySelector(':scope > .node')?.classList.add('connect-source');
}

function cancelConnect() {
  connectSource = null;
  document.body.classList.remove('connect-mode');
  document.querySelectorAll('.node').forEach(n => {
    n.classList.remove('connect-source', 'connect-target-hover');
  });
  document.getElementById('drag-line').style.display = 'none';
}

function finishConnect(toId) {
  if (!connectSource || toId === connectSource) { cancelConnect(); return; }
  const links = getTabLinks();
  const existing = links.find(l => (l.from === connectSource && l.to === toId) || (l.from === toId && l.to === connectSource));
  if (existing) {
    // already linked — remove it
    const tab = activeTab();
    tab.links = links.filter(l => l.id !== existing.id);
  } else {
    links.push({ id: uid(), from: connectSource, to: toId, label: '' });
  }
  persist();
  cancelConnect();
  drawLinks();
}

function deleteLink(linkId) {
  const tab = activeTab();
  if (!tab.links) return;
  tab.links = tab.links.filter(l => l.id !== linkId);
  persist();
  drawLinks();
}

function setLinkLabel(linkId, label) {
  const links = getTabLinks();
  const link = links.find(l => l.id === linkId);
  if (link) { link.label = label; persist(); drawLinks(); }
}

// get centre point of a node card in canvas-wrap coords
function getNodeCentre(nodeId) {
  const wrap = document.querySelector(`.node-block[data-id="${nodeId}"]`);
  if (!wrap) return null;
  const card = wrap.querySelector(':scope > .node');
  if (!card) return null;
  const canvasWrap = document.getElementById('canvas-wrap');
  const cr = card.getBoundingClientRect();
  const wr = canvasWrap.getBoundingClientRect();
  return {
    x: cr.left - wr.left + canvasWrap.scrollLeft + cr.width / 2,
    y: cr.top - wr.top + canvasWrap.scrollTop + cr.height / 2,
    left: cr.left - wr.left + canvasWrap.scrollLeft,
    right: cr.right - wr.left + canvasWrap.scrollLeft,
    top: cr.top - wr.top + canvasWrap.scrollTop,
    bottom: cr.bottom - wr.top + canvasWrap.scrollTop,
  };
}

// pick the best edge midpoint to connect from/to
function getEdgePoint(nodeId, otherNodeId) {
  const a = getNodeCentre(nodeId);
  const b = getNodeCentre(otherNodeId);
  if (!a || !b) return a;
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  if (Math.abs(dx) > Math.abs(dy)) {
    return dx > 0 ? { x: a.right, y: a.y } : { x: a.left, y: a.y };
  } else {
    return dy > 0 ? { x: a.x, y: a.bottom } : { x: a.x, y: a.top };
  }
}

function drawLinks() {
  const overlay = document.getElementById('link-overlay');
  overlay.querySelectorAll('.link-group').forEach(el => el.remove());

  const links = getTabLinks();
  if (!links.length) return;

  for (const link of links) {
    const a = getEdgePoint(link.from, link.to);
    const b = getEdgePoint(link.to, link.from);
    if (!a || !b) continue;

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.classList.add('link-group', 'dormant');
    g.dataset.from = link.from;
    g.dataset.to = link.to;
    g.dataset.linkId = link.id;

    const cx = (a.x + b.x) / 2;
    const cy = (a.y + b.y) / 2;
    const d = `M ${a.x} ${a.y} C ${cx} ${a.y} ${cx} ${b.y} ${b.x} ${b.y}`;

    // glow layer (behind)
    const glow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    glow.setAttribute('d', d);
    glow.classList.add('link-glow');

    // visible dashed path
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.classList.add('link-path');

    // wide invisible hit area
    const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    hit.setAttribute('d', d);
    hit.classList.add('link-hit');
    hit.addEventListener('contextmenu', e => { e.preventDefault(); deleteLink(link.id); });
    hit.addEventListener('dblclick', e => {
      e.stopPropagation();
      const lbl = prompt('link label (leave blank to remove):', link.label || '');
      if (lbl !== null) setLinkLabel(link.id, lbl.trim());
    });
    hit.title = 'right-click to delete · double-click to label';

    g.appendChild(glow);
    g.appendChild(path);
    g.appendChild(hit);

    // label
    if (link.label) {
      const labelG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      labelG.classList.add('link-label-wrap');
      const pad = 4;
      const approxW = link.label.length * 6.5 + pad * 2;
      const approxH = 16;
      const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bg.setAttribute('x', cx - approxW / 2);
      bg.setAttribute('y', cy - approxH / 2);
      bg.setAttribute('width', approxW);
      bg.setAttribute('height', approxH);
      bg.setAttribute('rx', 3);
      bg.classList.add('link-label-bg');
      const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', cx); txt.setAttribute('y', cy);
      txt.classList.add('link-label-text');
      txt.textContent = link.label;
      labelG.appendChild(bg); labelG.appendChild(txt);
      g.appendChild(labelG);
    }

    overlay.appendChild(g);
  }

  // size overlay
  const canvas = document.getElementById('canvas');
  overlay.setAttribute('width', canvas.scrollWidth + 64);
  overlay.setAttribute('height', canvas.scrollHeight + 80);

  // attach hover listeners to all nodes to activate their links
  attachLinkHoverListeners();
}

function activateLinksForNode(nodeId) {
  const overlay = document.getElementById('link-overlay');
  // mark all dormant first
  overlay.querySelectorAll('.link-group').forEach(g => {
    g.classList.add('dormant');
    g.classList.remove('active-link');
    // raise z not possible in SVG ordering but move to end = top
  });
  if (!nodeId) return;

  // find relevant links and activate
  overlay.querySelectorAll(`.link-group[data-from="${nodeId}"], .link-group[data-to="${nodeId}"]`).forEach(g => {
    g.classList.remove('dormant');
    g.classList.add('active-link');
    // move to end of SVG so it renders on top
    overlay.appendChild(g);
  });

  // highlight connected nodes
  document.querySelectorAll('.node.link-highlighted').forEach(n => n.classList.remove('link-highlighted'));
  const links = getTabLinks();
  links.filter(l => l.from === nodeId || l.to === nodeId).forEach(l => {
    const otherId = l.from === nodeId ? l.to : l.from;
    const otherWrap = document.querySelector(`.node-block[data-id="${otherId}"]`);
    if (otherWrap) otherWrap.querySelector(':scope > .node')?.classList.add('link-highlighted');
  });
}

function attachLinkHoverListeners() {
  document.querySelectorAll('.node-block[data-id]').forEach(wrap => {
    const card = wrap.querySelector(':scope > .node');
    if (!card || card._linkHoverBound) return;
    card._linkHoverBound = true;
    card.addEventListener('mouseenter', () => activateLinksForNode(wrap.dataset.id));
    card.addEventListener('mouseleave', () => {
      activateLinksForNode(null);
      document.querySelectorAll('.node.link-highlighted').forEach(n => n.classList.remove('link-highlighted'));
    });
  });
}

// connect mode mouse interactions on canvas-wrap
const canvasWrap = document.getElementById('canvas-wrap');

canvasWrap.addEventListener('mousemove', e => {
  if (!connectSource) return;
  const src = getNodeCentre(connectSource);
  if (!src) return;
  const wr = canvasWrap.getBoundingClientRect();
  const mx = e.clientX - wr.left + canvasWrap.scrollLeft;
  const my = e.clientY - wr.top + canvasWrap.scrollTop;
  const dl = document.getElementById('drag-line');
  dl.style.display = '';
  dl.setAttribute('d', `M ${src.x} ${src.y} C ${(src.x+mx)/2} ${src.y} ${(src.x+mx)/2} ${my} ${mx} ${my}`);
});

canvasWrap.addEventListener('mouseleave', () => {
  if (connectSource) document.getElementById('drag-line').style.display = 'none';
});

// node hover during connect
document.addEventListener('mouseover', e => {
  if (!connectSource) return;
  const nodeEl = e.target.closest('.node');
  document.querySelectorAll('.node.connect-target-hover').forEach(n => n.classList.remove('connect-target-hover'));
  if (nodeEl && !nodeEl.classList.contains('connect-source')) {
    nodeEl.classList.add('connect-target-hover');
  }
});

// click on a node to finish connecting
document.addEventListener('click', e => {
  if (!connectSource) return;
  const wrap = e.target.closest('.node-block[data-id]');
  if (wrap) {
    e.stopPropagation();
    finishConnect(wrap.dataset.id);
  } else if (!e.target.closest('.hook-btn')) {
    cancelConnect();
  }
}, true);

// esc to cancel
document.addEventListener('keydown', e => { if (e.key === 'Escape') cancelConnect(); });

// ─────────────────────────────────────────────────────────────────────────────
// PROGRESS
// ─────────────────────────────────────────────────────────────────────────────
// weighted progress: each node's progress = average of its direct children's progress
// leaf done=1, leaf undone=0. parent = mean of children. this weights by proximity.
function weightedProgress(node) {
  if (node.done) return 1;
  if (node.children.length === 0) return 0;
  const avg = node.children.reduce((sum, c) => sum + weightedProgress(c), 0) / node.children.length;
  return avg;
}

// ─────────────────────────────────────────────────────────────────────────────
// DRAG AND DROP REORDER
// ─────────────────────────────────────────────────────────────────────────────
let dragState = null; // { nodeId, siblingList: [id,...] }

function getSiblingIds(nodeId) {
  // returns the list of sibling node ids (same parent list) for a given node
  const tree = activeTab().tree;
  const ctx = findContext(tree, nodeId);
  if (!ctx) return [];
  return ctx.list.map(n => n.id);
}

function makeDraggable(wrap, node) {

  wrap.addEventListener('dragstart', e => {
    e.stopPropagation();
    const siblingIds = getSiblingIds(node.id);
    dragState = { nodeId: node.id, siblingIds };
    wrap.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', node.id);
  });

  wrap.addEventListener('dragend', () => {
    wrap.classList.remove('dragging');
    document.querySelectorAll('.drag-over-above, .drag-over-below').forEach(el => {
      el.classList.remove('drag-over-above', 'drag-over-below');
    });
    dragState = null;
    setTimeout(() => { redrawAllConnectors(); drawLinks(); }, 60);
  });

  wrap.addEventListener('dragover', e => {
    if (!dragState || dragState.nodeId === node.id) return;
    // only respond if this node is a sibling of the dragged node
    if (!dragState.siblingIds.includes(node.id)) return;
    e.preventDefault();
    e.stopPropagation();
    e.dataTransfer.dropEffect = 'move';
    const rect = wrap.getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    // clear only siblings' indicators
    dragState.siblingIds.forEach(id => {
      const el = document.querySelector(`.node-block[data-id="${id}"]`);
      if (el) el.classList.remove('drag-over-above', 'drag-over-below');
    });
    wrap.classList.add(e.clientY < mid ? 'drag-over-above' : 'drag-over-below');
  });

  wrap.addEventListener('dragleave', e => {
    if (!wrap.contains(e.relatedTarget)) {
      wrap.classList.remove('drag-over-above', 'drag-over-below');
    }
  });

  wrap.addEventListener('drop', e => {
    e.preventDefault();
    e.stopPropagation();
    if (!dragState || dragState.nodeId === node.id) return;
    if (!dragState.siblingIds.includes(node.id)) return;

    const isAbove = wrap.classList.contains('drag-over-above');
    wrap.classList.remove('drag-over-above', 'drag-over-below');

    const tree = activeTab().tree;
    const srcCtx = findContext(tree, dragState.nodeId);
    const dstCtx = findContext(tree, node.id);
    if (!srcCtx || !dstCtx || srcCtx.list !== dstCtx.list) return;

    const list = srcCtx.list;
    const [moved] = list.splice(srcCtx.index, 1);
    const newDstIdx = list.findIndex(n => n.id === node.id);
    list.splice(isAbove ? newDstIdx : newDstIdx + 1, 0, moved);

    persist();
    renderCanvas();
  });
}

function computeStats(tree) {
  let done = 0, total = 0, overdue = 0, starred = 0;
  function walk(n) {
    total++;
    if (n.done) done++;
    if (isOverdue(n)) overdue++;
    if (n.starred && !n.done) starred++;
    n.children.forEach(walk);
  }
  tree.forEach(walk);
  return { done, total, left: total - done, overdue, starred };
}

function renderStats() {
  const el = document.getElementById('header-stats');
  if (!el) return;
  const tab = activeTab();
  if (!tab || tab.tree.length === 0) { el.innerHTML = ''; return; }
  const { done, left, overdue, starred } = computeStats(tab.tree);
  const doneWord = done === 1 ? 'baby' : 'babies';
  const leftWord = left === 1 ? 'remains' : 'remain';
  let html = `<span class="stat-done">${done}</span> ${doneWord} defeated. <span class="stat-left">${left}</span> ${leftWord}.`;
  if (overdue > 0) {
    html += ` <span class="stat-overdue">${overdue} overdue.</span>`;
  }
  if (starred > 0) {
    const starWord = starred === 1 ? 'unusually strong baby' : 'unusually strong babies';
    html += ` <span class="stat-starred">${starred} ${starWord}.</span>`;
  }
  el.innerHTML = html;
}

// ─────────────────────────────────────────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────────────────────────────────────────
const searchToggle = document.getElementById('search-toggle');
const searchBox = document.getElementById('search-box');
const searchResults = document.getElementById('search-results');

function highlightMatch(text, query) {
  if (!query) return text;
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return text;
  return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + query.length) + '</mark>' + text.slice(idx + query.length);
}

function getNodePath(tree, targetId, path = []) {
  for (const n of tree) {
    const newPath = [...path, n.title];
    if (n.id === targetId) return newPath;
    const found = getNodePath(n.children, targetId, newPath);
    if (found) return found;
  }
  return null;
}

function runSearch(query) {
  const q = query.trim().toLowerCase();
  searchResults.innerHTML = '';

  if (!q) { searchResults.classList.remove('show'); return; }

  const tab = activeTab();
  if (!tab) return;
  const matches = [];

  function walk(nodes) {
    for (const n of nodes) {
      const titleMatch = n.title.toLowerCase().includes(q);
      const noteMatch = n.note && n.note.toLowerCase().includes(q);
      if (titleMatch || noteMatch) matches.push({ node: n, titleMatch, noteMatch });
      walk(n.children);
    }
  }
  walk(tab.tree);

  if (!matches.length) {
    searchResults.innerHTML = '<div class="search-empty">no results</div>';
    searchResults.classList.add('show');
    return;
  }

  matches.forEach(({ node, titleMatch, noteMatch }) => {
    const path = getNodePath(tab.tree, node.id);
    const el = document.createElement('div');
    el.className = 'search-result';

    const titleEl = document.createElement('div');
    titleEl.className = 'sr-title';
    titleEl.innerHTML = titleMatch ? highlightMatch(node.title, query.trim()) : node.title;

    el.appendChild(titleEl);

    // breadcrumb path (excluding the node itself)
    if (path && path.length > 1) {
      const meta = document.createElement('div');
      meta.className = 'sr-meta';
      meta.textContent = path.slice(0, -1).join(' › ');
      el.appendChild(meta);
    }

    // note snippet
    if (noteMatch && node.note) {
      const noteSnip = document.createElement('div');
      noteSnip.className = 'sr-note';
      const idx = node.note.toLowerCase().indexOf(q);
      const start = Math.max(0, idx - 30);
      const snippet = (start > 0 ? '…' : '') + node.note.slice(start, idx + q.length + 40) + (idx + q.length + 40 < node.note.length ? '…' : '');
      noteSnip.innerHTML = highlightMatch(snippet, query.trim());
      el.appendChild(noteSnip);
    }

    el.addEventListener('click', () => {
      // expand ancestors so node is visible
      function expandTo(nodes, id) {
        for (const n of nodes) {
          if (n.id === id) return true;
          if (expandTo(n.children, id)) { n.expanded = true; return true; }
        }
        return false;
      }
      expandTo(tab.tree, node.id);
      persist();
      renderCanvas();
      setTimeout(() => {
        const el = document.querySelector(`.node-block[data-id="${node.id}"]`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        // briefly highlight
        const card = el?.querySelector(':scope > .node');
        if (card) {
          card.style.outline = '2px solid rgba(255,255,255,0.6)';
          card.style.outlineOffset = '2px';
          setTimeout(() => { card.style.outline = ''; card.style.outlineOffset = ''; }, 1800);
        }
      }, 120);
      closeSearch();
    });

    searchResults.appendChild(el);
  });

  searchResults.classList.add('show');
}

function closeSearch() {
  searchBox.value = '';
  searchBox.classList.remove('open');
  searchResults.classList.remove('show');
  searchToggle.classList.remove('active');
}

searchToggle.addEventListener('click', () => {
  const open = searchBox.classList.toggle('open');
  searchToggle.classList.toggle('active', open);
  if (open) { searchBox.focus(); }
  else { closeSearch(); }
});

searchBox.addEventListener('input', () => runSearch(searchBox.value));

searchBox.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSearch();
  if (e.key === 'Enter') {
    const first = searchResults.querySelector('.search-result');
    if (first) first.click();
  }
});

document.addEventListener('click', e => {
  if (!e.target.closest('#search-wrap')) closeSearch();
});

function renderAll() { renderTabs(); renderCanvas(); }

window.addEventListener('resize', () => { redrawAllConnectors(); drawLinks(); });
document.getElementById('canvas-wrap').addEventListener('scroll', drawLinks);

// ─────────────────────────────────────────────────────────────────────────────
// POMODORO TIMER
// ─────────────────────────────────────────────────────────────────────────────
const POMO_MODES = {
  work:  { label: 'work session',  key: 'pomo-work-input',  defaultMin: 25 },
  short: { label: 'short break',   key: 'pomo-short-input', defaultMin: 5  },
  long:  { label: 'long break',    key: 'pomo-long-input',  defaultMin: 15 },
};

let pomoState = {
  mode: 'work',
  totalSecs: 25 * 60,
  remainingSecs: 25 * 60,
  running: false,
  interval: null,
};

const originalTitle = document.title;

function togglePomoPanel() {
  const panel = document.getElementById('pomo-panel');
  const btn = document.getElementById('pomo-btn');
  const showing = panel.classList.toggle('show');
  if (btn) {
    btn.style.color = showing ? '#fff' : '';
    btn.style.borderColor = showing ? 'rgba(255,255,255,0.3)' : '';
  }
}

function getModeMinutes(mode) {
  const inputId = POMO_MODES[mode].key;
  const el = document.getElementById(inputId);
  const v = parseInt(el?.value) || POMO_MODES[mode].defaultMin;
  return Math.max(1, Math.min(99, v));
}

function pomoSetMode(mode) {
  if (pomoState.running) pomoStop();
  pomoState.mode = mode;
  const mins = getModeMinutes(mode);
  pomoState.totalSecs = mins * 60;
  pomoState.remainingSecs = mins * 60;
  document.querySelectorAll('.pomo-mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  document.getElementById('pomo-session-label').textContent = POMO_MODES[mode].label;
  pomoRenderTime();
  pomoRenderProgress();
  document.getElementById('pomo-panel').classList.remove('running', 'break-running');
}

function pomoRenderTime() {
  const m = Math.floor(pomoState.remainingSecs / 60);
  const s = pomoState.remainingSecs % 60;
  const str = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  document.getElementById('pomo-time').textContent = str;
  if (pomoState.running) {
    document.title = `${str} — ${POMO_MODES[pomoState.mode].label} · taskbaby`;
  }
}

function pomoRenderProgress() {
  const pct = pomoState.totalSecs > 0
    ? (pomoState.remainingSecs / pomoState.totalSecs) * 100
    : 100;
  const fill = document.getElementById('pomo-progress-fill');
  fill.style.width = pct + '%';
  fill.style.background = pomoState.mode !== 'work' ? 'var(--green-text)' : 'rgba(255,255,255,0.5)';
}

function pomoTick() {
  if (pomoState.remainingSecs <= 0) {
    pomoStop();
    pomoNotify();
    return;
  }
  pomoState.remainingSecs--;
  pomoRenderTime();
  pomoRenderProgress();
}

function pomoStart() {
  if (pomoState.running) return;
  pomoState.running = true;
  pomoState.interval = setInterval(pomoTick, 1000);
  const btn = document.getElementById('pomo-play-btn');
  btn.textContent = '⏸ pause';
  btn.classList.add('running');
  const panel = document.getElementById('pomo-panel');
  if (pomoState.mode === 'work') {
    panel.classList.add('running'); panel.classList.remove('break-running');
  } else {
    panel.classList.add('break-running'); panel.classList.remove('running');
  }
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function pomoStop() {
  if (!pomoState.running) return;
  pomoState.running = false;
  clearInterval(pomoState.interval);
  pomoState.interval = null;
  const btn = document.getElementById('pomo-play-btn');
  btn.textContent = '▶ start';
  btn.classList.remove('running');
  document.getElementById('pomo-panel').classList.remove('running', 'break-running');
  document.title = originalTitle;
}

function pomoToggle() {
  if (pomoState.running) pomoStop(); else pomoStart();
}

function pomoReset() {
  pomoStop();
  const mins = getModeMinutes(pomoState.mode);
  pomoState.totalSecs = mins * 60;
  pomoState.remainingSecs = mins * 60;
  pomoRenderTime();
  pomoRenderProgress();
}

function pomoUpdateDurations() {
  if (!pomoState.running) {
    const mins = getModeMinutes(pomoState.mode);
    pomoState.totalSecs = mins * 60;
    pomoState.remainingSecs = mins * 60;
    pomoRenderTime();
    pomoRenderProgress();
  }
}

function pomoNotify() {
  const label = POMO_MODES[pomoState.mode].label;
  const isWork = pomoState.mode === 'work';
  document.title = `✅ ${label} done! · taskbaby`;
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(`taskbaby — ${label} complete`, {
      body: isWork ? 'time for a break! 🎉' : 'break over — back to work.',
    });
  }
  let flashes = 0;
  const flashInterval = setInterval(() => {
    document.title = flashes % 2 === 0 ? `⏰ ${label} done! · taskbaby` : `taskbaby`;
    flashes++;
    if (flashes >= 8) { clearInterval(flashInterval); document.title = originalTitle; }
  }, 600);
  setTimeout(() => { pomoSetMode(isWork ? 'short' : 'work'); }, 1200);
}

// init pomo display on load
pomoRenderTime();
pomoRenderProgress();

// drag-to-move pomo panel
(function() {
  const panel = document.getElementById('pomo-panel');
  const handle = document.getElementById('pomo-drag-handle');
  let dragging = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;

  function getPanelRect() {
    return panel.getBoundingClientRect();
  }

  // normalise: convert bottom/right to explicit top/left so we can move it freely
  function ensureTopLeft() {
  if (panel.style.top && panel.style.left) return;
  const r = getPanelRect();
  panel.style.top  = r.top + 'px';
  panel.style.left = r.left + 'px';
  panel.style.bottom = 'auto'; // explicitly kill the CSS bottom
  panel.style.right  = 'auto'; // explicitly kill the CSS right
}

  handle.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    ensureTopLeft();
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;
    origLeft = parseInt(panel.style.left) || 0;
    origTop  = parseInt(panel.style.top)  || 0;
    panel.classList.add('is-dragging');
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    let newLeft = origLeft + dx;
    let newTop  = origTop  + dy;
    // clamp to viewport
    newLeft = Math.max(0, Math.min(newLeft, window.innerWidth  - panel.offsetWidth));
    newTop  = Math.max(0, Math.min(newTop,  window.innerHeight - panel.offsetHeight));
    panel.style.left = newLeft + 'px';
    panel.style.top  = newTop  + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    panel.classList.remove('is-dragging');
  });
})();

// ─────────────────────────────────────────────────────────────────────────────

loadState().then(() => {
  if (!state.activeTab) state.activeTab = state.tabs[0].id;
  renderAll();
  initAuth();

  // check every 30s if any node's overdue status has changed and re-render if so
  setInterval(() => {
    const tab = activeTab();
    if (!tab) return;
    let anyOverdueChanged = false;
    function checkNodes(nodes) {
      for (const n of nodes) {
        const el = document.querySelector(`.node-block[data-id="${n.id}"] > .node`);
        if (!el) { checkNodes(n.children); continue; }
        const wasOverdue = el.classList.contains('overdue');
        const nowOverdue = isOverdue(n);
        if (wasOverdue !== nowOverdue) { anyOverdueChanged = true; break; }
        checkNodes(n.children);
      }
    }
    checkNodes(tab.tree);
    if (anyOverdueChanged) { renderCanvas(); setTimeout(drawLinks, 80); }
  }, 30000);
});
